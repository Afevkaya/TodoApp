<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Asya Restaurant</title>
  </head>
  <body>
    <main class="container mt-5">
      <h1 class="text-center mb-3">Asian Kitchen's Menu</h1>
      <div class="d-flex justify-content-center mb-4">
        <div
          id="category-container"
          class="d-flex flex-wrap justify-content-center gap-2"
          role="group"
          aria-label="kategori butonları"
        ></div>
      </div>
      <div id="product-container" class="row justify-content-center g-4"></div>
    </main>
    <script src="script.js"></script>
    <style>
      .menu-btn {
        border-width: 2px;
        box-shadow: 0 0.125rem 0.4rem rgba(0, 0, 0, 0.15);
      }

      .menu-btn.active {
        background-color: #212529;
        color: #fff;
      }

      .product-thumb {
        width: 100%;
        height: 150px;
        object-fit: cover;
      }

      @media (max-width: 575px) {
        .product-thumb {
          height: 120px;
        }
      }
    </style>
  </body>
</html>
